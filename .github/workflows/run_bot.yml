name: Yeni Haber Botu Testi

on:
  schedule:
    - cron: '0 8 * * *' # Her gün Türkiye saatiyle 11:00 (UTC 08:00)
  workflow_dispatch: # İstersen elle de başlatabilmen için manuel buton

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-generativeai python-dotenv

      - name: Botu Calistir
        env:
          BASEROW_TOKEN: ${{ secrets.BASEROW_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py
