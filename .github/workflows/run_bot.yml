name: Haber Botu Manuel Test

on:
  workflow_dispatch: # Otomatik tarama kapatıldı. Sadece GitHub üzerinden sen butona basınca çalışır.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-generativeai python-dotenv

      - name: Botu Calistir
        env:
          BASEROW_TOKEN: ${{ secrets.BASEROW_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: - name: Botu Calistir
        env:
          BASEROW_TOKEN: ${{ secrets.BASEROW_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py
